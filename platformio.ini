; ESP32-S3 firmware uses ESP-IDF. Windows and Linux builds use the same
; sources through the host branch of CMakeLists.txt.

[platformio]
src_dir = main
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 2MB
board_upload.after_reset = watchdog-reset
monitor_speed = 115200
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
